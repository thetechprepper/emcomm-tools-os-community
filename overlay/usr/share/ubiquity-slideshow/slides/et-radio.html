<div class="header"><h1 class="slidetitle">Radio Plug-and-Play</h1></div>

<div class="main">

<div class="text">

<div>
<p>et-radio supports plug-and-play configuration for several radios.</p>

<ul>
  <li>Open a terminal.</li>
  <li>Run "et-radio" and select your radio.</li>
  <li>Plug in your radio.</li>
</ul>

<p>No configuration needed for any radio-based application!</p>
