<p>et-mode supports zero-configuration when running your favorite radio applications and modes.</p>

<p>Open a terminal, run "et-mode" and select an application.</p>

<p>No configuration. Just operate!</p>

<p>For JS8Call or fldigi, just click the desktop icons.</p>
